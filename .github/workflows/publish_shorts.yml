name: Publicar Shorts en YouTube

on:
  schedule:
    # Horarios en UTC (Equivalentes a Hora Colombia UTC-5 optimizados por datos):
    # 02:00 UTC -> 9:00 PM Colombia (Pico máximo nocturno)
    # 15:00 UTC -> 10:00 AM Colombia (Pico matutino)
    # 18:00 UTC -> 1:00 PM Colombia (Pico almuerzo)
    # 23:00 UTC -> 6:00 PM Colombia (Pico regreso a casa)
    - cron: '0 2,15,18,23 * * *'
  workflow_dispatch:
    # Permite disparar la publicación manualmente con un clic desde GitHub o la App Móvil

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Publicador Autónomo de Shorts
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GDRIVE_PENDING_FOLDER_ID: ${{ secrets.GDRIVE_PENDING_FOLDER_ID }}
          GDRIVE_PUBLISHED_FOLDER_ID: ${{ secrets.GDRIVE_PUBLISHED_FOLDER_ID }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
          DEFAULT_CTA: ${{ secrets.DEFAULT_CTA }}
          COOLDOWN_MINUTES: "45"
        run: |
          python worker.py
