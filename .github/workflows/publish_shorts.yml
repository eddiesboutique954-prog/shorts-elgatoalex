name: Piloto Automático de Shorts (Rolling Buffer)

on:
  schedule:
    # Se ejecuta 2 veces al día en minutos no congestionados (ej. :25 y :45)
    # 08:25 UTC -> 3:25 AM Colombia (Madrugada, carga el día)
    # 19:45 UTC -> 2:45 PM Colombia (Tarde, revisa y recarga)
    - cron: '25 8,19 * * *'
  workflow_dispatch:
    # Permite disparar la recarga del colchón manualmente cuando quieras

jobs:
  replenish_buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mantener Colchón de Shorts en YouTube
        env:
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GDRIVE_PENDING_FOLDER_ID: ${{ secrets.GDRIVE_PENDING_FOLDER_ID }}
          GDRIVE_PUBLISHED_FOLDER_ID: ${{ secrets.GDRIVE_PUBLISHED_FOLDER_ID }}
          TARGET_BUFFER: "8"
          MAX_PER_RUN: "4"
        run: |
          python core/buffer_scheduler.py
